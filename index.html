<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোঃ সরওয়ার আলম সবুজ - রিলস মোশন গ্রাফিক্স</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #060911;
            color: #ffffff;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        #stage {
            position: relative;
            height: 94vh;
            aspect-ratio: 9 / 16;
            max-width: 96vw;
            background: radial-gradient(circle at 20% 18%, #1e293b 0%, #0d1322 52%, #06080f 100%);
            border: 1px solid rgba(255, 136, 0, 0.25);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        .ambient-glow {
            position: absolute;
            width: 65%;
            height: 45%;
            background: radial-gradient(circle, rgba(255, 106, 0, 0.18) 0%, transparent 72%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatGlow 7s infinite alternate ease-in-out;
        }
        .glow-1 { top: -8%; left: -12%; }
        .glow-2 {
            bottom: -10%;
            right: -12%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.16) 0%, transparent 72%);
            animation-delay: -3.5s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.12); }
        }

        .clear-icon { width: 20px; height: 20px; flex-shrink: 0; }
        .sm-icon { width: 17px; height: 17px; }
        .lg-icon { width: 32px; height: 32px; }

        .scene {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10% 6.5%;
            z-index: 2;
            text-align: center;
        }

        .scene.active {
            display: flex;
            z-index: 5;
        }

        #wipe-overlay {
            position: absolute;
            top: -15%;
            left: -135%;
            width: 125%;
            height: 130%;
            background: linear-gradient(135deg, #ff6a00 0%, #d93800 100%);
            border-right: 4px solid #ffd166;
            transform: skewX(-15deg);
            z-index: 50;
            pointer-events: none;
        }

        .wipe-animate {
            animation: screenWipe 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        @keyframes screenWipe {
            0% { left: -135%; }
            45% { left: -12%; }
            55% { left: -12%; }
            100% { left: 125%; }
        }

        /* সিন ১ */
        #scene-1.active { flex-direction: column; justify-content: center; gap: 38px; }
        .intro-left { width: 100%; z-index: 2; }
        .hello-text { font-size: clamp(1.35rem, 3.8vw, 2.05rem); font-weight: 600; margin-bottom: 10px; opacity: 0; transform: translateY(20px); }
        .name-text { font-size: clamp(1.95rem, 5.6vw, 3.05rem); font-weight: 700; line-height: 1.25; background: linear-gradient(90deg, #ff6a00 0%, #ffaa00 60%, #ffd000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 24px; opacity: 0; transform: translateY(25px); }
        .badges-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .prof-badge { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; background: rgba(255, 115, 0, 0.14); border: 1px solid rgba(255, 145, 0, 0.45); border-radius: 50px; font-size: clamp(0.88rem, 2.5vw, 1.15rem); color: #f8fafc; opacity: 0; transform: scale(0.85) translateY(15px); }
        .prof-badge .clear-icon { color: #ff9800; }

        .orbit-wrapper { position: relative; width: 180px; height: 180px; display: flex; justify-content: center; align-items: center; margin-top: 8px; opacity: 0; transform: scale(0.8); }
        .orbit-glow { position: absolute; width: 78%; height: 78%; background: radial-gradient(circle, rgba(255, 110, 0, 0.35) 0%, transparent 70%); border-radius: 50%; }
        .orbit-ring { position: absolute; width: 100%; height: 42%; border: 1.5px solid rgba(255, 255, 255, 0.35); border-radius: 50%; transform: rotate(-28deg); }
        .orbit-ring-2 { position: absolute; width: 90%; height: 36%; border: 1px solid rgba(255, 165, 0, 0.35); border-radius: 50%; transform: rotate(35deg); }
        .orbit-dot { position: absolute; top: -5px; right: 20%; width: 10px; height: 10px; background: #ffaa00; border-radius: 50%; }
        .video-box-icon { width: 70px; height: 52px; border: 2.5px solid #ffffff; border-radius: 14px; display: flex; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.9); z-index: 2; padding: 11px; }
        .video-box-icon svg { width: 100%; height: 100%; }
        .sparkle-star { position: absolute; top: 8%; right: 8%; width: 26px; height: 26px; }

        /* সিন ২ */
        #scene-2.active { flex-direction: column; justify-content: center; gap: 22px; }
        .q-left { display: flex; flex-direction: column; gap: 16px; width: 100%; }
        .glass-card { background: rgba(30, 41, 59, 0.78); border: 1px solid rgba(255, 145, 50, 0.32); border-radius: 16px; padding: 17px 20px; text-align: left; opacity: 0; transform: translateY(25px); }
        .card-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 0.95rem; color: #ff9d42; margin-bottom: 6px; }
        .card-q-text { font-size: clamp(1.12rem, 3.4vw, 1.62rem); font-weight: 600; }
        .q-arrow { width: 38px; height: 38px; transform: rotate(90deg) scale(0.5); display: flex; align-items: center; justify-content: center; margin: 4px 0; opacity: 0; }
        .q-arrow svg { width: 100%; height: 100%; }
        .q-right { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .topic-pill { display: flex; align-items: center; gap: 12px; padding: 15px 20px; background: rgba(30, 41, 59, 0.78); border: 1.5px solid rgba(255, 115, 0, 0.38); border-radius: 14px; font-size: clamp(1.12rem, 3.2vw, 1.52rem); font-weight: 600; color: #ffb84d; opacity: 0; transform: translateX(30px); }
        .topic-pill.highlight { border-color: #ff6a00; background: rgba(255, 106, 0, 0.16); }

        /* সিন ৩ */
        #scene-3.active { gap: 28px; }
        .course-top-pill { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 145, 50, 0.35); border-radius: 14px; font-size: clamp(1.02rem, 3vw, 1.42rem); font-weight: 600; opacity: 0; transform: translateY(-20px); }
        .course-flow { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 14px; }
        .skill-box { background: rgba(30, 41, 59, 0.78); border: 1px solid rgba(255, 140, 50, 0.35); border-radius: 18px; padding: 18px 22px; text-align: center; width: 90%; opacity: 0; }
        .skill-box h3 { font-size: clamp(1.08rem, 3vw, 1.42rem); margin-bottom: 12px; }
        .app-icons { display: flex; justify-content: center; gap: 12px; }
        .adobe-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 1.2rem; }
        .ps-icon { background: #001e36; color: #31a8ff; border: 2px solid #31a8ff; }
        .ai-icon { background: #330000; color: #ff9a00; border: 2px solid #ff9a00; }
        .ve-icon { background: #2b1405; color: #ff8800; border: 2px solid #ff8800; width: 48px; height: 48px; padding: 9px; }
        .ve-icon svg { width: 100%; height: 100%; }
        .connect-line { width: 2px; height: 22px; background: linear-gradient(180deg, #ff7b00, #ffaa00); opacity: 0; }
