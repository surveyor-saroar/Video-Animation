<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোঃ সরওয়ার আলম সবুজ - মোশন গ্রাফিক্স প্রেজেন্টেশন</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #080402;
            color: #ffffff;

            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #stage {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        .ambient-glow {
            position: absolute;
            width: 45%;
            height: 45%;
            background: radial-gradient(circle, rgba(255, 94, 0, 0.16) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatGlow 8s infinite alternate ease-in-out;
        }
        .glow-1 { top: -10%; left: -5%; }
        .glow-2 { bottom: -15%; right: -5%; animation-delay: -4s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(4%, 6%) scale(1.15); }
        }

        .clear-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        .sm-icon {
            width: 17px;
            height: 17px;
        }
        .lg-icon {
            width: 32px;
            height: 32px;
        }

        .scene {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5%;
            z-index: 2;
        }

        .scene.active {
            display: flex;
            z-index: 5;
        }

        #wipe-overlay {
            position: absolute;
            top: -10%;
            left: -130%;
            width: 120%;
            height: 120%;
            background: linear-gradient(135deg, #ff5100 0%, #d93800 100%);
            border-right: 4px solid #ffbe55;
            transform: skewX(-15deg);
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 0 40px rgba(255, 81, 0, 0.8);
        }

        .wipe-animate {
            animation: screenWipe 0.85s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        @keyframes screenWipe {
            0% { left: -130%; }
            45% { left: -10%; }
            55% { left: -10%; }
            100% { left: 120%; }
        }

        /* সিন ১ */
        #scene-1.active { flex-direction: row; justify-content: space-between; padding: 0 9%; }
        .intro-left { max-width: 65%; z-index: 2; }

        .name-text { font-size: clamp(2.1rem, 4.3vw, 4.2rem); font-weight: 700; line-height: 1.2; background: linear-gradient(90deg, #ff6a00 0%, #ffaa00 60%, #ffd000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5em; opacity: 0; transform: translateY(25px); }
        .badges-container { display: flex; flex-wrap: wrap; gap: 12px; }

        .prof-badge .clear-icon { color: #ff8c00; }

        .orbit-wrapper { position: relative; width: clamp(160px, 22vw, 280px); height: clamp(160px, 22vw, 280px); display: flex; justify-content: center; align-items: center; opacity: 0; transform: scale(0.8); }
        .orbit-glow { position: absolute; width: 75%; height: 75%; background: radial-gradient(circle, rgba(255, 98, 0, 0.35) 0%, transparent 70%); border-radius: 50%; }

        .orbit-ring-2 { position: absolute; width: 90%; height: 36%; border: 1px solid rgba(255, 153, 0, 0.3); border-radius: 50%; transform: rotate(35deg); }

        .video-box-icon svg { width: 100%; height: 100%; }

        .phone-btns { display: flex; gap: 8px; margin: 10px 0; }
        .p-btn-blue { flex: 1; background: #1877f2; color: #fff; text-align: center; padding: 6px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .p-btn-gray { flex: 1; background: #e4e6eb; color: #050505; text-align: center; padding: 6px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }

        /* সিন ৫ */
        #scene-5.active { align-items: flex-start; padding: 0 9%; gap: 22px; }
        .free-heading { font-size: clamp(2rem, 3.6vw, 3.4rem); font-weight: 700; opacity: 0; }

        .bento-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; width: 100%; }

        .b-gd { grid-column: span 7; }

        .b-more { grid-column: span 3; flex-direction: column; justify-content: center; text-align: center; gap: 8px; }
        .bento-title { font-size: clamp(1.1rem, 1.7vw, 1.55rem); font-weight: 600; }
        .ai-pills { display: flex; gap: 10px; flex-wrap: wrap; }
        .ai-chip { background: #ffffff; color: #111111; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; }

        #scene-6.active { flex-direction: row; justify-content: center; gap: 8%; padding: 0 10%; }
