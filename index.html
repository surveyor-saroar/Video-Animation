<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোঃ সরওয়ার আলম সবুজ - মোশন গ্রাফিক্স প্রেজেন্টেশন</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #080402;
            color: #ffffff;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #stage {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background: radial-gradient(circle at 20% 25%, #2e1105 0%, #120602 45%, #070301 100%);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        .ambient-glow {
            position: absolute;
            width: 45%;
            height: 45%;
            background: radial-gradient(circle, rgba(255, 94, 0, 0.16) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatGlow 8s infinite alternate ease-in-out;
        }
        .glow-1 { top: -10%; left: -5%; }
        .glow-2 { bottom: -15%; right: -5%; animation-delay: -4s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(4%, 6%) scale(1.15); }
        }

        .clear-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        .sm-icon {
            width: 17px;
            height: 17px;
        }
        .lg-icon {
            width: 32px;
            height: 32px;
        }

        .scene {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5%;
            z-index: 2;
        }

        .scene.active {
            display: flex;
            z-index: 5;
        }

        #wipe-overlay {
            position: absolute;
            top: -10%;
            left: -130%;
            width: 120%;
            height: 120%;
            background: linear-gradient(135deg, #ff5100 0%, #d93800 100%);
            border-right: 4px solid #ffbe55;
            transform: skewX(-15deg);
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 0 40px rgba(255, 81, 0, 0.8);
        }

        .wipe-animate {
            animation: screenWipe 0.85s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        @keyframes screenWipe {
            0% { left: -130%; }
            45% { left: -10%; }
            55% { left: -10%; }
            100% { left: 120%; }
        }

        .intro-left { max-width: 65%; z-index: 2; }
