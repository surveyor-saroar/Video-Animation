<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোঃ সরওয়ার আলম সবুজ - রিলস অ্যানিমেশন ও ক্যাপশন</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background:
                radial-gradient(circle at 50% 48%, rgba(255, 118, 0, 0.24) 0%, rgba(245, 158, 11, 0.12) 34%, transparent 62%),
                radial-gradient(circle at 22% 24%, rgba(255, 115, 0, 0.25) 0%, transparent 48%),
                radial-gradient(circle at 78% 76%, rgba(14, 165, 233, 0.24) 0%, transparent 50%),
                linear-gradient(135deg, #070b14 0%, #0d1528 52%, #060911 100%);
            color: #ffffff;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            user-select: none;
            position: relative;
            cursor: pointer;
        }

        #reel-area {
            position: relative;
            height: 100vh;
            width: min(100vw, 56.25vh);
            z-index: 2;
            overflow: hidden;
        }

        .top-bars {
            position: absolute;
            top: 12px;
            left: 14px;
            right: 14px;
            display: flex;
            gap: 5px;
            z-index: 30;
        }
        .bar-seg {
            flex: 1;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fde047, #22c55e);
        }

        .scene {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12% 6% 24% 6%;
            text-align: center;
        }
        .scene.active {
            display: flex;
            z-index: 10;
        }

        .ic { width: 18px; height: 18px; flex-shrink: 0; }
        .ic-lg { width: 24px; height: 24px; flex-shrink: 0; }
        .ic-question { width: 30px; height: 30px; flex-shrink: 0; }
        .ic-laptop { width: 40px; height: 40px; flex-shrink: 0; }

        .check-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.22);
            border: 2px solid #4ade80;
            color: #fde047;
            font-size: 1rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .q-mark {
            font-size: 1.15em;
            font-weight: 800;
            margin-left: 8px;
            color: #fde047;
        }

        #wipe-overlay {
            position: fixed;
            top: -15%;
            left: -140%;
            width: 120%;
            height: 130%;
            background: linear-gradient(135deg, #ff6a00 0%, #d93800 100%);
            border-right: 4px solid #ffd166;
            transform: skewX(-15deg);
            z-index: 40;
            pointer-events: none;
            opacity: 0;
        }
        .wipe-run {
            opacity: 1;
            animation: screenWipe 0.85s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }
        @keyframes screenWipe {
            0% { left: -140%; opacity: 1; }
            45% { left: -10%; opacity: 1; }
            55% { left: -10%; opacity: 1; }
            100% { left: 130%; opacity: 0; }
        }

        #pause-badge {
            position: fixed;
            top: 22px;
            right: 18px;
            z-index: 50;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 170, 0, 0.7);
            color: #fde047;
            font-size: 0.9rem;
            font-weight: 700;
            display: none;
            pointer-events: none;
        }
        body.paused #pause-badge { display: inline-block; }

        .anim-item {
            opacity: 0;
            transform: translateY(22px) scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .anim-item.pop-in {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .hello-text {
            font-size: clamp(1.25rem, 3.4vh, 1.8rem);
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .name-row {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .name-circle {
            width: clamp(54px, 8vh, 70px);
            height: clamp(54px, 8vh, 70px);
            border-radius: 50%;
            border: 2.5px solid #ffaa00;
            box-shadow: 0 0 18px rgba(255, 145, 0, 0.45);
            background: linear-gradient(135deg, #ff6a00, #d93800);
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            font-weight: 700;
        }
        .name-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
        }
        .name-text {
            font-size: clamp(1.5rem, 4.1vh, 2.35rem);
            font-weight: 700;
            line-height: 1.25;
            color: #ffaa00;
        }
        .badges-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
        .prof-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            background: rgba(255, 115, 0, 0.16);
            border: 1px solid rgba(255, 145, 0, 0.5);
            border-radius: 50px;
            font-size: clamp(0.86rem, 1.95vh, 1.05rem);
            color: #ff9d42;
        }
        .prof-badge span { color: #f8fafc; }

        .card-box {
            width: 100%;
            background: rgba(23, 35, 56, 0.9);
            border: 1px solid rgba(255, 145, 50, 0.36);
            border-radius: 16px;
            padding: 13px 16px;
            margin-bottom: 10px;
            text-align: left;
        }
        .card-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-weight: 600;
            color: #ffffff;
        }
        .pill-box {
            width: 100%;
            background: rgba(23, 35, 56, 0.9);
            border: 1px solid rgba(255, 145, 50, 0.36);
            border-radius: 14px;
            padding: 12px 15px;
            margin-bottom: 9px;
            font-weight: 600;
            color: #ffb84d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .pill-left { display: inline-flex; align-items: center; gap: 9px; text-align: left; }
        .mini-tag {
            font-size: 0.76rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            flex-shrink: 0;
        }

        .title-lg {
            font-size: clamp(1.22rem, 3.2vh, 1.9rem);
            font-weight: 700;
            margin-bottom: 14px;
            background: linear-gradient(90deg, #fde047 0%, #84cc16 50%, #22c55e 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .profile-row { display: flex; align-items: center; gap: 12px; width: 100%; }
        .avatar-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2.5px solid #ff9d42;
            background: linear-gradient(135deg, #ff6a00, #d93800);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            font-weight: 700;
        }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
        .avatar-fallback { display: none; font-size: 0.95rem; }
        .broken .avatar-fallback { display: inline-block; }
        .profile-text { text-align: left; }
        .profile-name { font-weight: 700; font-size: clamp(1rem, 2.3vh, 1.2rem); color: #ffffff; }
        .profile-sub { font-size: 0.82rem; color: #cbd5e1; }

        .follow-btn {
            margin-top: 10px;
            padding: 9px 22px;
            border-radius: 50px;
            background: #ff6200;
            color: #fff;
            font-weight: 700;
