<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোঃ সরওয়ার আলম সবুজ - রিলস মোশন গ্রাফিক্স</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05070d;
            color: #ffffff;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        /* খাড়াখারি (9:16) রিলস স্টেজ ও নতুন ব্যাকগ্রাউন্ড */
        #stage {
            position: relative;
            width: 56.25vh;
            height: 100vh;
            max-width: 100vw;
            max-height: 177.78vw;
            background:
                radial-gradient(circle at 18% 15%, rgba(255, 106, 0, 0.24) 0%, transparent 45%),
                radial-gradient(circle at 85% 78%, rgba(30, 90, 220, 0.22) 0%, transparent 50%),
                linear-gradient(165deg, #111827 0%, #090d16 52%, #06080f 100%);
            overflow: hidden;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.95);
        }

        /* সূক্ষ্ম গ্রিড প্যাটার্ন ব্যাকগ্রাউন্ড */
        #stage::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none;
            z-index: 1;
        }

        .ambient-glow {
            position: absolute;
            width: 65%;
            height: 45%;
            background: radial-gradient(circle, rgba(255, 115, 0, 0.2) 0%, transparent 72%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: floatGlow 7s infinite alternate ease-in-out;
        }
        .glow-1 { top: -8%; left: -12%; }
        .glow-2 {
            bottom: -10%;
            right: -12%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, transparent 72%);
            animation-delay: -3.5s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.12); }
        }

        .clear-icon { width: 20px; height: 20px; flex-shrink: 0; }
        .sm-icon { width: 17px; height: 17px; }
        .lg-icon { width: 32px; height: 32px; }

        .scene {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8% 6%;
            z-index: 3;
            text-align: center;
        }

        .scene.active {
            display: flex;
            z-index: 5;
        }

        #wipe-overlay {
            position: absolute;
            top: -15%;
            left: -135%;
            width: 125%;
            height: 130%;
            background: linear-gradient(135deg, #ff6a00 0%, #e03e00 100%);
            border-right: 4px solid #ffd166;
            transform: skewX(-16deg);
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 0 45px rgba(255, 106, 0, 0.8);
        }

        .wipe-animate {
            animation: screenWipe 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        @keyframes screenWipe {
            0% { left: -135%; }
            45% { left: -12%; }
            55% { left: -12%; }
            100% { left: 125%; }
        }

        /* সিন ১ (খারাখারি স্ট্যাক) */
        #scene-1.active {
            flex-direction: column;
            justify-content: center;
            gap: 28px;
        }
        .intro-left { max-width: 100%; z-index: 2; }
        .hello-text { font-size: clamp(1.4rem, 4.2vw, 2.2rem); font-weight: 600; margin-bottom: 4px; opacity: 0; transform: translateY(20px); }
        .name-text { font-size: clamp(2rem, 6.2vw, 3.3rem); font-weight: 700; line-height: 1.2; background: linear-gradient(90deg, #ff6a00 0%, #ffaa00 60%, #ffd000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; opacity: 0; transform: translateY(25px); }
        .badges-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .prof-badge { display: inline-flex; align-items: center; gap: 7px; padding: 8px 15px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 145, 0, 0.45); border-radius: 50px; font-size: clamp(0.9rem, 2.8vw, 1.2rem); color: #f8fafc; opacity: 0; transform: scale(0.85) translateY(15px); }
        .prof-badge .clear-icon { color: #ff9800; }

        .orbit-wrapper { position: relative; width: clamp(150px, 34vw, 220px); height: clamp(150px, 34vw, 220px); display: flex; justify-content: center; align-items: center; opacity: 0; transform: scale(0.8); }
        .orbit-glow { position: absolute; width: 80%; height: 80%; background: radial-gradient(circle, rgba(255, 110, 0, 0.35) 0%, transparent 70%); border-radius: 50%; }
        .orbit-ring { position: absolute; width: 100%; height: 42%; border: 1.5px solid rgba(255, 255, 255, 0.35); border-radius: 50%; transform: rotate(-28deg); }
        .orbit-ring-2 { position: absolute; width: 90%; height: 36%; border: 1px solid rgba(255, 165, 0, 0.35); border-radius: 50%; transform: rotate(35deg); }
        .orbit-dot { position: absolute; top: -5px; right: 20%; width: 10px; height: 10px; background: #ffaa00; border-radius: 50%; }
        .video-box-icon { width: 72px; height: 54px; border: 2.5px solid #ffffff; border-radius: 14px; display: flex; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.9); z-index: 2; padding: 11px; }
