<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোঃ সরওয়ার আলম সবুজ - রিলস মোশন গ্রাফিক্স</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background:
                radial-gradient(circle at 50% 48%, rgba(255, 118, 0, 0.24) 0%, rgba(245, 158, 11, 0.12) 34%, transparent 62%),
                radial-gradient(circle at 22% 24%, rgba(255, 115, 0, 0.25) 0%, transparent 48%),
                radial-gradient(circle at 78% 76%, rgba(14, 165, 233, 0.24) 0%, transparent 50%),
                linear-gradient(135deg, #070b14 0%, #0d1528 52%, #060911 100%);
            color: #ffffff;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            user-select: none;
            position: relative;
            cursor: pointer;
        }
        #reel-area {
            position: relative;
            height: 100vh;
            width: min(100vw, 56.25vh);
            z-index: 2;
        }
        .scene {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 9% 5%;
            text-align: center;
        }
        .scene.active { display: flex; z-index: 10; }

        .ic { width: 18px; height: 18px; flex-shrink: 0; }
        .ic-sm { width: 15px; height: 15px; flex-shrink: 0; }
        .ic-lg { width: 24px; height: 24px; flex-shrink: 0; }
        .ic-question { width: 32px; height: 32px; flex-shrink: 0; }
        .ic-laptop { width: 42px; height: 42px; flex-shrink: 0; }

        .check-badge {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #4ade80;
            color: #fde047;
            font-size: 1.05rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            line-height: 1;
        }

        .q-mark {
            font-size: 1.15em;
            font-weight: 800;
            line-height: 1.1;
            margin-left: 10px;
            display: inline-block;
            vertical-align: middle;
            white-space: nowrap;
            color: #fde047;
        }

        #wipe-overlay {
            position: fixed;
            top: -15%;
            left: -140%;
            width: 120%;
            height: 130%;
            background: linear-gradient(135deg, #ff6a00 0%, #d93800 100%);
            border-right: 4px solid #ffd166;
            transform: skewX(-15deg);
            z-index: 40;
            pointer-events: none;
            opacity: 0;
        }
        .wipe-animate {
            opacity: 1;
            animation: screenWipe 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }
        body.paused .wipe-animate {
            animation-play-state: paused;
        }
        @keyframes screenWipe {
            0% { left: -140%; opacity: 1; }
            45% { left: -10%; opacity: 1; }
            55% { left: -10%; opacity: 1; }
            100% { left: 130%; opacity: 0; }
        }

        .anim-item {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: opacity 0.45s ease, transform 0.45s ease;
        }
        .anim-item.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .hello-text { font-size: clamp(1.3rem, 3.6vh, 1.9rem); font-weight: 600; margin-bottom: 8px; }

        .name-row {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .name-circle {
            width: clamp(54px, 8.2vh, 72px);
            height: clamp(54px, 8.2vh, 72px);
            border-radius: 50%;
            border: 2.5px solid #ffaa00;
            box-shadow: 0 0 18px rgba(255, 145, 0, 0.45);
            background: linear-gradient(135deg, #ff6a00, #d93800);
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            font-weight: 700;
            color: #ffffff;
        }
