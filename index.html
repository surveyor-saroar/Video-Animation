<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোঃ সরওয়ার আলম সবুজ - রিলস মোশন গ্রাফিক্স</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background:
                radial-gradient(circle at 50% 48%, rgba(255, 118, 0, 0.24) 0%, rgba(245, 158, 11, 0.12) 34%, transparent 62%),
                radial-gradient(circle at 22% 24%, rgba(255, 115, 0, 0.25) 0%, transparent 48%),
                radial-gradient(circle at 78% 76%, rgba(14, 165, 233, 0.24) 0%, transparent 50%),
                linear-gradient(135deg, #070b14 0%, #0d1528 52%, #060911 100%);
            color: #ffffff;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            user-select: none;
            position: relative;
            cursor: pointer;
        }
        #reel-area {
            position: relative;
            height: 100vh;
            width: min(100vw, 56.25vh);
            z-index: 2;
        }
        .scene {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 9% 5%;
            text-align: center;
        }
        .scene.active {
            display: flex;
            z-index: 10;
        }

        .ic { width: 18px; height: 18px; flex-shrink: 0; }
        .ic-sm { width: 15px; height: 15px; flex-shrink: 0; }
        .ic-lg { width: 24px; height: 24px; flex-shrink: 0; }
        .ic-question { width: 32px; height: 32px; flex-shrink: 0; }
        .ic-laptop { width: 42px; height: 42px; flex-shrink: 0; }

        .check-badge {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.22);
            border: 2px solid #4ade80;
            color: #fde047;
            font-size: 1.05rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            line-height: 1;
        }

        .q-mark {
            font-size: 1.15em;
            font-weight: 800;
            line-height: 1.1;
            margin-left: 10px;
            display: inline-block;
            vertical-align: middle;
            white-space: nowrap;
            color: #fde047;
        }

        #wipe-overlay {
            position: fixed;
            top: -15%;
            left: -140%;
            width: 120%;
            height: 130%;
            background: linear-gradient(135deg, #ff6a00 0%, #d93800 100%);
            border-right: 4px solid #ffd166;
            transform: skewX(-15deg);
            z-index: 40;
            pointer-events: none;
            opacity: 0;
        }
        .wipe-animate {
            opacity: 1;
            animation: screenWipe 0.85s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }
        body.paused .wipe-animate {
            animation-play-state: paused;
        }
        @keyframes screenWipe {
            0% { left: -140%; opacity: 1; }
            45% { left: -10%; opacity: 1; }
            55% { left: -10%; opacity: 1; }
            100% { left: 130%; opacity: 0; }
        }

        #pause-badge {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 50;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 170, 0, 0.65);
            color: #fde047;
            font-size: 0.9rem;
            font-weight: 700;
            display: none;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }
        body.paused #pause-badge {
            display: inline-flex;
        }

        .anim-item {
            opacity: 0;
            transform: translateY(22px) scale(0.95);
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .anim-item.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        body.paused .anim-item {
            transition: none;
        }

        .hello-text {
            font-size: clamp(1.3rem, 3.6vh, 1.9rem);
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .name-row {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .name-circle {
            width: clamp(54px, 8.2vh, 72px);
            height: clamp(54px, 8.2vh, 72px);
            border-radius: 50%;
            border: 2.5px solid #ffaa00;
            box-shadow: 0 0 18px rgba(255, 145, 0, 0.45);
            background: linear-gradient(135deg, #ff6a00, #d93800);
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            font-weight: 700;
            color: #ffffff;
        }
        .name-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
        }
        .name-text {
            font-size: clamp(1.6rem, 4.4vh, 2.5rem);
            font-weight: 700;
            line-height: 1.25;
            color: #ffaa00;
        }

        .badges-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .prof-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            background: rgba(255, 115, 0, 0.16);
            border: 1px solid rgba(255, 145, 0, 0.5);
            border-radius: 50px;
            font-size: clamp(0.88rem, 2vh, 1.08rem);
            color: #ff9d42;
        }
        .prof-badge span { color: #f8fafc; }

        .card-box {
            width: 100%;
            background: rgba(23, 35, 56, 0.88);
            border: 1px solid rgba(255, 145, 50, 0.36);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 12px;
            text-align: left;
        }
        .card-meta {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.86rem;
            color: #ff9d42;
            margin-bottom: 4px;
        }
        .card-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-weight: 600;
            color: #ffffff;
        }

        .profile-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        .avatar-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2.5px solid #ff9d42;
            background: linear-gradient(135deg, #ff6a00, #d93800);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            font-weight: 700;
            color: #ffffff;
        }
        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
        }
        .avatar-fallback {
            display: none;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
        .broken .avatar-fallback {
            display: inline-block;
        }
        .profile-text {
            text-align: left;
        }
        .profile-name {
            font-weight: 700;
            font-size: clamp(1rem, 2.4vh, 1.25rem);
            color: #ffffff;
        }
        .profile-sub {
            font-size: 0.84rem;
            color: #cbd5e1;
        }

        .pill-box {
            width: 100%;
            background: rgba(23, 35, 56, 0.88);
            border: 1px solid rgba(255, 145, 50, 0.36);
            border-radius: 14px;
            padding: 13px 16px;
            margin-bottom: 10px;
            font-weight: 600;
            color: #ffb84d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .pill-left {
            display: inline-flex;
            align-items: center;
            gap: 9px;
        }
        .mini-tag {
            font-size: 0.78rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .title-lg {
            font-size: clamp(1.35rem, 3.6vh, 2.15rem);
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #fde047 0%, #84cc16 50%, #22c55e 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .follow-btn {
            margin-top: 12px;
            padding: 10px 22px;
            border-radius: 50px;
            background: #ff6200;
            color: #fff;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .follow-btn.done { background: #16a34a; }
    </style>
</head>
<body>
<div id="pause-badge">❚❚ থামানো হয়েছে (ক্লিক করলে চলবে)</div>

    <div id="wipe-overlay"></div>

    <!-- সিন ১ -->

                <img class="saroar01-photo" src="saroar01.png" alt="মোঃ সরওয়ার আলম সবুজ">

    <div id="scene-2" class="scene">
        <div id="e7" class="card-box anim-item">
            <div class="card-meta">
                <svg class="ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">

                </svg>
                <span>কমেন্ট</span>

                </svg>

        <div id="e8" class="card-box anim-item">
            <div class="card-meta">
                <svg class="ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">

                    <polyline points="22,6 12,13 2,6"/>
                </svg>
                <span>ইনবক্স</span>
            </div>
            <div class="card-main">
                <span>ক
