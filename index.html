<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোঃ সরওয়ার আলম সবুজ - রিলস মোশন গ্রাফিক্স</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* পুরো স্ক্রিনজুড়ে একটানা ফ্ল্যাট/স্মুথ ব্যাকগ্রাউন্ড */
        body {
            background: radial-gradient(circle at 50% 35%, #162033 0%, #0b101d 60%, #060912 100%);
            color: #ffffff;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            user-select: none;
            position: relative;
        }

        /* কোনো বর্ডার বা আলাদা বাক্স ছাড়া মাঝের ক্রপ-এরিয়া */
        #reel-area {
            position: relative;
            height: 100vh;
            width: min(100vw, 56.25vh);
            background: transparent;
            border: none;
            overflow: visible;
            z-index: 2;
        }

        .clear-icon { width: 20px; height: 20px; flex-shrink: 0; }
        .sm-icon { width: 17px; height: 17px; }
        .lg-icon { width: 32px; height: 32px; }

        .scene {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8% 5%;
            z-index: 2;
            text-align: center;
        }

        .scene.active {
            display: flex;
            z-index: 5;
        }

        #wipe-overlay {
            position: absolute;
            top: -15%;
            left: -135%;
            width: 125%;
            height: 130%;
            background: linear-gradient(135deg, #ff6a00 0%, #d93800 100%);
            border-right: 4px solid #ffd166;
            transform: skewX(-15deg);
            z-index: 50;
            pointer-events: none;
        }

        .wipe-animate {
            animation: screenWipe 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        @keyframes screenWipe {
            0% { left: -135%; }
            45% { left: -12%; }
            55% { left: -12%; }
            100% { left: 125%; }
        }

        /* সিন ১ */
        #scene-1.active { flex-direction: column; justify-content: center; gap: 34px; }
        .intro-left { width: 100%; z-index: 2; }
        .hello-text { font-size: clamp(1.3rem, 3.6vh, 1.9rem); font-weight: 600; margin-bottom: 8px; white-space: nowrap; opacity: 0; transform: translateY(20px); }
        .name-text { font-size: clamp(1.75rem, 4.8vh, 2.75rem); font-weight: 700; line-height: 1.25; background: linear-gradient(90deg, #ff6a00 0%, #ffaa00 60%, #ffd000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; white-space: nowrap; opacity: 0; transform: translateY(25px); }
        .badges-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .prof-badge { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; background: rgba(255, 115, 0, 0.14); border: 1px solid rgba(255, 145, 0, 0.45); border-radius: 50px; font-size: clamp(0.85rem, 2vh, 1.08rem); color: #f8fafc; white-space: nowrap; opacity: 0; transform: scale(0.85) translateY(15px); }
        .prof-badge .clear-icon { color: #ff9800; }

        .orbit-wrapper { position: relative; width: 170px; height: 170px; display: flex; justify-content: center; align-items: center; margin-top: 6px; opacity: 0; transform: scale(0.8); }
        .orbit-glow { position: absolute; width: 78%; height: 78%; background: radial-gradient(circle, rgba(255, 110, 0, 0.35) 0%, transparent 70%); border-radius: 50%; }
        .orbit-ring { position: absolute; width: 100%; height: 42%; border: 1.5px solid rgba(255, 255, 255, 0.35); border-radius: 50%; transform: rotate(-28deg); }
        .orbit-ring-2 { position: absolute; width: 90%; height: 36%; border: 1px solid rgba(255, 165, 0, 0.35); border-radius: 50%; transform: rotate(35deg); }
        .orbit-dot { position: absolute; top: -5px; right: 20%; width: 10px; height: 10px; background: #ffaa00; border-radius: 50%; }
        .video-box-icon { width: 68px; height: 50px; border: 2.5px solid #ffffff; border-radius: 14px; display: flex; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.9); z-index: 2; padding: 11px; }
        .video-box-icon svg { width: 100%; height: 100%; }
        .sparkle-star { position: absolute; top: 8%; right: 8%; width: 26px; height: 26px; }

        /* সিন ২ */
        #scene-2.active { flex-direction: column; justify-content: center; gap: 20px; }
        .q-left { display: flex; flex-direction: column; gap: 14px; width: 100%; }
        .glass-card { background: rgba(30, 41, 59, 0.78); border: 1px solid rgba(255, 145, 50, 0.32); border-radius: 16px; padding: 15px 18px; text-align: left; opacity: 0; transform: translateY(25px); }
        .card-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 0.92rem; color: #ff9d42; margin-bottom: 5px; }
        .card-q-text { font-size: clamp(1.05rem, 2.8vh, 1.45rem); font-weight: 600; white-space: nowrap; }
        .q-arrow { width: 34px; height: 34px; transform: rotate(90deg) scale(0.5); display: flex; align-items: center; justify-content: center; margin: 2px 0; opacity: 0; }
        .q-arrow svg { width: 100%; height: 100%; }
        .q-right { display: flex; flex-direction: column; gap: 13px; width: 100%; }
        .topic-pill { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: rgba(30, 41, 59, 0.78); border: 1.5px solid rgba(255, 115, 0, 0.38); border-radius: 14px; font-size: clamp(1.08rem, 2.8vh, 1.45rem); font-weight: 600; color: #ffb84d; white-space: nowrap; opacity: 0; transform: translateX(30px); }
        .topic-pill.highlight { border-color: #ff6a00; background: rgba(255, 106, 0, 0.16); }

        /* সিন ৩ */
        #scene-3.active { gap: 24px; }
        .course-top-pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 145, 50, 0.35); border-radius: 14px; font-size: clamp(1rem, 2.5vh, 1.3rem); font-weight: 600; white-space: nowrap; opacity: 0; transform: translateY(-20px); }
        .course-flow { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 12px; }
        .skill-box { background: rgba(30, 41, 59, 0.78); border: 1px solid rgba(255, 140, 50, 0.35); border-radius: 18px; padding: 16px 20px; text-align: center; width: 92%; opacity: 0; }
        .skill-box h3 { font-size: clamp(1.05rem, 2.6vh, 1.35rem); margin-bottom: 10px; white-space: nowrap; }
        .app-icons { display: flex; justify-content: center; gap: 12px; }
        .adobe-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 1.15rem; }
        .ps-icon { background: #001e36; color: #31a8ff; border: 2px solid #31a8ff; }
        .ai-icon { background: #330000; color: #ff9a00; border: 2px solid #ff9a00; }
        .ve-icon { background: #2b1405; color: #ff8800; border: 2px solid #ff8800; width: 46px; height: 46px; padding: 8px; }
        .ve-icon svg { width: 100%; height: 100%; }
        .connect-line { width: 2px; height: 20px; background: linear-gradient(180deg, #ff7b00, #ffaa00); opacity: 0; }
        .question-circle { width: 74px; height: 74px; border-radius: 50%; background: rgba(255, 106, 0, 0.2); border: 2px solid rgba(255, 120, 0, 0.6); display: flex; justify-content: center; align-items: center; font-size: 2.3rem; font-weight: 700; color: #ff9800; opacity: 0; transform: scale(0.5); }

        /* সিন ৪ */
        #scene-4.active { flex-direction: column; justify-content: center; gap: 26px; }
        .s4-left { width: 100%; }
        .s4-sub { font-size: clamp(1.12rem, 2.8vh, 1.55rem); color: #e2e8f0; margin-bottom: 6px; white-space: nowrap; opacity: 0; }
        .s4-title { font-size: clamp(1.75rem, 4.5vh, 2.65rem); font-weight: 700; line-height: 1.22; margin-bottom: 18px; white-space: nowrap; opacity: 0; }
        .s4-title span { color: #ff7700; }
        .page-brand-row { display: flex; align-items: center; justify-content: center; gap: 12px; opacity: 0; transform: translateY(20px); }
        .red-avatar-box { width: 52px; height: 52px; border-radius: 14px; background: #d91e18; border: 2px solid #ff5c5c; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .red-avatar-box img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
        .aix-brand-name { font-size: clamp(1.15rem, 3vh, 1.55rem); font-weight: 700; text-align: left; white-space: nowrap; }
        .phone-mockup { width: 245px; background: #ffffff; color: #111111; border-radius: 26px; border: 6px solid #2b2b2b; overflow: hidden; text-align: left; opacity: 0; transform: translateY(40px); }
        .phone-cover { height: 74px; background: linear-gradient(135deg, #ff6a00, #1e3a8a); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.75rem; font-weight: 600; padding: 8px; text-align: center; }
        .phone-body { padding: 12px 14px 16px; }
        .phone-avatar { width: 50px; height: 50px; border-radius: 50%; background: #d91e18; overflow: hidden; border: 3px solid #fff; margin-top: -28px; margin-bottom: 6px; }
        .phone-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
        .phone-btns { display: flex; gap: 8px; margin: 10px 0; }
        .p-btn-blue { flex: 1; background: #1877f2; color: #fff; text-align: center; padding: 6px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .p-btn-gray { flex: 1; background: #e4e6eb; color: #050505; text-align: center; padding: 6px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }

        /* সিন ৫ */
        #
