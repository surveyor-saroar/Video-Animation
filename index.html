<!DOCTYPE html>
<html lang="bn">
<head>

</head>
<body>

<div id="stage">
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div id="wipe-overlay"></div>

    <!-- সিন ১: ইন্ট্রো (0:00 - 0:04) -->
    <div id="scene-1" class="scene">
        <div class="intro-left">
            <div id="s1-hello" class="hello-text">Hello, আমি</div>
            <div id="s1-name" class="name-text">মোঃ সরওয়ার আলম সবুজ</div>
            <div class="badges-container">

                    <svg class="clear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                        <path d="M2 2l7.586 7.586"/>
                    </svg>
                    Graphics Designer

                <div id="s1-b2" class="prof-badge">
                    <svg class="clear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <polygon points="10 9 15 12 10 15 10 9" fill="currentColor" stroke="none"/>
                    </svg>
                    Video Editor
                </div>
                <div id="s1-b3" class="prof-badge">
                    <svg class="clear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
                        <line x1="9" y1="3" x2="9" y2="18"/>
                        <line x1="15" y1="6" x2="15" y2="21"/>
                    </svg>
                    Land Surveyor
                </div>
            </div>
        </div>

        <div id="s1-orbit" class="orbit-wrapper">
            <div class="orbit-glow"></div>
            <div class="orbit-ring"><div class="orbit-dot"></div></div>
            <div class="orbit-ring-2"></div>
            <div class="video-box-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2.5"/>
                    <polygon points="10 9 15.5 12 10 15 10 9" fill="#ffffff" stroke="none"/>
                </svg>
            </div>
            <svg class="sparkle-star" viewBox="0 0 24 24" fill="#ffd000">
                <path d="M12 2L14.8 9.2L22 12L14.8 14.8L12 22L9.2 14.8L2 12L9.2 9.2L12 2Z"/>
            </svg>
        </div>
    </div>

    <!-- সিন ২: কমেন্ট ও ইনবক্স প্রশ্ন (0:05 - 0:15) -->
    <div id="scene-2" class="scene">
        <div class="q-left">
            <div id="s2-c1" class="glass-card">
                <div class="card-tag">
                    <svg class="clear-icon sm-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    কমেন্ট
                </div>
                <div class="card-q-text">কীভাবে এই ভিডিও তৈরি করেন?</div>
            </div>
            <div id="s2-c2" class="glass-card">
                <div class="card-tag">
                    <svg class="clear-icon sm-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>

                    ইনবক্স
                </div>
                <div class="card-q-text">কীভাবে এগুলো তৈরি করেন?</div>
            </div>
        </div>

        <div id="s2-arrow" class="q-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ff9d00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </svg>
        </div>

        <div class="q-right">
            <div id="s2-t1" class="topic-pill">
                <svg class="clear-icon" viewBox="0 0 24 24" fill="#ffb84d">
                    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
                </svg>
                AI
            </div>
            <div id="s2-t2" class="topic-pill">
                <svg class="clear-icon" viewBox="0 0 24 24" fill="none" stroke="#ffb84d" stroke-width="2.2" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1
